  level: everyday
  question: I want to run a raffle at our conference booth. Are there limits on the prizes?
  answer: Each prize under $600 USD and all prizes together under $1,000 USD under the standard process.
  keywords:
  - '600'
  sources:
  - - https://handbook.gitlab.com/handbook/legal/process-for-a-conference-sweepstakes/#eligibility-requirements-for-proceeding-under-this-process

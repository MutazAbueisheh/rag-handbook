  question: A fast-quarantined test is still broken after 3 days. What are the options, and when would it be deleted?
  answer: Fix it, remove it, or convert it to long-term quarantine; long-term lasts at most 3 months, after which
    the test is deleted automatically.
  keywords:
  - 3 months
  sources:
  - - https://handbook.gitlab.com/handbook/engineering/testing/quarantine-process/#quarantine-phase-durations
- id: fh17
  level: hard
  question: If the SIRT on-call engineer does not acknowledge a page, who gets paged next and when?
  answer: After 15 minutes all Security Engineers in the sunny region, then the Security Operations manager after
    another 15 minutes, then the SIRT director.
  keywords:
  - manager
  - director
  sources:
  - - https://handbook.gitlab.com/handbook/security/security-operations/secops-oncall/#on-call-paging-workflow
- id: fh18
  level: hard
  question: A Severity 3 Customer Support Systems incident has been unresolved for 10 hours. Should it be escalated,
    and what is the target resolution time?
  answer: Yes; Severity 3 escalates after 8 hours without resolution. Target resolution is 24-48 hours.
  keywords:
  - 8 hours
  - 24-48
  sources:
  - - https://handbook.gitlab.com/handbook/eta/css/incidents/#resolution-times
- id: fh19
  level: hard
  question: Can a conference sweepstakes with $800 of total prizes include New Zealand?
  answer: No. New Zealand can only be included when the total value of all prizes is under $500 USD.
  keywords:
  - '500'
  sources:
  - - https://handbook.gitlab.com/handbook/legal/process-for-a-conference-sweepstakes/#eligibility-requirements-for-proceeding-under-this-process
- id: fh20
  level: hard
  question: My Support region has 25 engineers and 5 are already on PTO on my dates. If I take off too, what is
    the capacity status and what should I do?
  answer: 6 of 25 = 24%, which is Red (over 20%); consider a different time-off schedule.
  keywords:
  - red
  sources:
  - - https://handbook.gitlab.com/handbook/support/support-time-off/#choosing-and-recording-time-off
- id: fh21
  level: hard
  question: For the SUS survey, who counts as an experienced user, and how active must a user be to be invited?
  answer: Tenure of 180 days or more; at least 10 product events across at least 2 stages in the previous 30 days.
  keywords:
  - '180'
  - '10'
  sources:
  - - https://handbook.gitlab.com/handbook/product/ux/performance-indicators/system-usability-scale/#regular-participant-criteria
  - - https://handbook.gitlab.com/handbook/product/ux/performance-indicators/system-usability-scale/#regular-participant-criteria

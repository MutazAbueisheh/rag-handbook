  level: everyday
  question: My new laptop arrived. What do I do with the old one?
  answer: Wipe or return it within 2 weeks of receiving the replacement.
  keywords:
  - 2 weeks
  sources:
  - - https://handbook.gitlab.com/handbook/eta/corporate-it/end-user-services/laptop-management/laptop-ordering/#current-refresh-delays-updated-21-august-2026
- id: fp12
  level: everyday
  question: I'm joining from Germany and want a Linux laptop on day one. How early does it need to be ordered?
  answer: At least 5 weeks before (EMEA Linux); Apple takes 3 weeks.
  keywords:
  - 5 weeks
  sources:
  - - https://handbook.gitlab.com/handbook/eta/corporate-it/end-user-services/laptop-management/laptop-ordering/#new-hire-laptop-ordering-process
- id: fp13
  level: everyday
  question: Is GitLab off between Christmas and New Year?
  answer: Yes, Family and Friends days on 2026-12-28 to 2026-12-31 (FY27).
  keywords:
  - '28'
  sources:
  - - https://handbook.gitlab.com/handbook/company/family-and-friends-day/#fy27-family-and-friends-days
- id: fp14
  level: everyday
  question: I want to give a gift to someone who works for the US government. How much can I spend?
  answer: At most $20 USD per person per event.
  keywords:
  - '20'
  sources:
  - - https://handbook.gitlab.com/handbook/legal/policies/gifts-contributions/#government-officials---special-considerations
- id: fp15
  level: everyday
  question: Can I take my whole team out to dinner on the company card?
  answer: Yes for up to 20 people, at no more than $100 per person.
  keywords:
  - '100'
  sources:
  - - https://handbook.gitlab.com/handbook/finance/accounts-payable/corp-credit-cards/#3-permissible-items
- id: fp16
  level: everyday
  question: Can I pay for my WeWork membership with the purchasing card?
  answer: No. Co-working space is not permitted on the card; expense it personally through the normal reimbursement
    process.
  keywords:
  - not
  sources:
  - - https://handbook.gitlab.com/handbook/finance/accounts-payable/corp-credit-cards/#co-working-space
- id: fp17
  level: everyday
  question: A coworker's dad passed away. Can I send flowers with the purchasing card?
  answer: Yes, gifts for significant life events are allowed up to $125 USD.
  keywords:
  - '125'
  sources:
  - - https://handbook.gitlab.com/handbook/finance/accounts-payable/corp-credit-cards/#3-permissible-items
- id: fp18
  level: everyday
  question: I mistyped my password a few times and now my GitLab.com account is locked. Will it unlock by itself?
  answer: No. After a successful login the user gets an email with a six-digit unlock code to enter on a verification
    page.
  keywords:
  - code
  sources:
  - - https://handbook.gitlab.com/handbook/support/workflows/reinstating-blocked-accounts/#locked-accounts
- id: fp19
  level: everyday
  question: I signed up for GitLab.com but never clicked the confirmation email. What happens?
  answer: After 3 days the account is blocked and scheduled for deletion.
  keywords:
  - 3 days
  sources:
  - - https://handbook.gitlab.com/handbook/support/workflows/reinstating-blocked-accounts/#user-is-blocked-with-no-admin-note
- id: fp20
  level: everyday
  question: I deleted my free GitLab.com account. When can I reuse my username?
  answer: After waiting 7 days from the deletion request.
  keywords:
  - 7 days
  sources:
  - - https://handbook.gitlab.com/handbook/support/workflows/reinstating-blocked-accounts/#user-initiated-self-serve-deletion
- id: fp21
  level: everyday
  question: GitLab.com was down a lot last month. Can our company get money back?
  answer: Eligible customers get credits if monthly uptime fell below 99.9%, claimed within 30 days after the month
    ends.
  keywords:
  - '99.9'
  sources:
  - - https://handbook.gitlab.com/handbook/support/workflows/downtime_credits_workflow/#overview
- id: fp22
  level: everyday
  question: I came up with an invention at work. Do I get a bonus for it?
  answer: Yes, the patent program pays $250 when accepted, $500 when filed and $1,000 when issued, per named inventor.
  keywords:
  - '250'
  sources:
  - - https://handbook.gitlab.com/handbook/legal/patent-program/#patent-awards
- id: fp23
  level: everyday
  question: I've got a meeting next week. When should I send the agenda?
  answer: 72 hours in advance (24 hours minimum).
  keywords:
  - '72'
  sources:
  - - https://handbook.gitlab.com/handbook/company/culture/all-remote/meetings/#what-to-do-before-the-meeting
- id: fp24
  level: everyday
  question: We recorded a meeting. When should I post the recording?
  answer: Add the recording link to the agenda within 12 hours after the meeting.
  keywords:
  - 12 hours
  sources:
  - - https://handbook.gitlab.com/handbook/company/culture/all-remote/meetings/#what-to-do-after-the-meeting
- id: fp25
  level: everyday
  question: A test keeps failing randomly and I was told to quarantine it. How long can it stay quarantined?
  answer: Fast quarantine up to 3 days; long-term quarantine up to 3 months, then it is deleted automatically.
  keywords:
  - 3 months
  sources:
  - - https://handbook.gitlab.com/handbook/engineering/testing/quarantine-process/#long-term-quarantine
- id: fp26
  level: everyday
  question: I review merge requests and I'm going on vacation. What should I do with my reviews?
  answer: Check assigned reviews on the last working day; leave a message with PTO dates or reassign; tell the author
    if a review can't be finished.
  keywords:
  - reassign
  sources:
  - - https://handbook.gitlab.com/handbook/engineering/workflow/code-review/#managing-review-assignments-before-pto
- id: fp27
  level: everyday
  question: I was picked as a quarterly MVP! Can I expense a fancy dinner?
  answer: Yes, a meal up to $250 USD, expensed within the same quarter; only the meal qualifies.
  keywords:
  - '250'
  sources:
  - - https://handbook.gitlab.com/handbook/sales/field-operations/field-enablement/field-team-recognition/#quarterly-mvp-recognition-dinner
- id: fp28
  level: everyday
  question: How long does it take for swag to arrive in the US?
  answer: 3-7 business days after approval and fulfillment; allow about 2 weeks from placing the order.
  keywords:
  - 3-7
  sources:
  - - https://handbook.gitlab.com/handbook/marketing/brand-experience/merchandise-handling/cro-swag/#standard-turnaround-times-
- id: fp29
  level: everyday
  question: Do support engineers get Family and Friends days off like everyone else?
  answer: Support works as normal on those days; in FY26 Support team members may take 4 days at their convenience
    instead.
  keywords:
  - 4 days
  sources:
  - - https://handbook.gitlab.com/handbook/support/support-time-off/#how-support-handles-family-and-friends-days

  question: I'm a newly hired senior engineer. Do I start as a code reviewer, and how long do I have to become a
    maintainer?
  answer: No, senior+ hires become trainee maintainers instead of reviewers, and should complete maintainership
    within 12 months of finishing onboarding.
  keywords:
  - trainee
  - 12 months
  sources:
  - - https://handbook.gitlab.com/handbook/engineering/workflow/code-review/#senior-maintainers
- id: fp9
  level: everyday
  question: I got paged at 3am while on call. How fast do I have to respond?
  answer: Acknowledge within 15 minutes.
  keywords:
  - '15'
  sources:
  - - https://handbook.gitlab.com/handbook/engineering/infrastructure-platforms/incident-management/on-call/#on-call-responsibilities-and-expectations-for-both-tier-1-and-tier-2
    - https://handbook.gitlab.com/handbook/engineering/infrastructure-platforms/incident-management/on-call/#practical-aspects-of-being-on-call
- id: fp10
  level: everyday
  question: I was on call all weekend and I'm wiped out. Can I take some time off?
  answer: Yes, take 1-2 days off as time off in lieu.
  keywords:
  - 1-2
  sources:
  - - https://handbook.gitlab.com/handbook/engineering/infrastructure-platforms/incident-management/on-call/#general-expectations-for-on-call
